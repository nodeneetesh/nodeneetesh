<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" width="100%" height="170">
  <defs>
    <radialGradient id="bootGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#E23636" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="700" height="170" fill="url(#bootGlow)"/>

  <!-- radiating web lines drawing themselves in -->
  <g stroke="#E23636" stroke-width="1.4" fill="none">
    <path d="M350,10 L120,150" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1.1s" begin="0s" fill="freeze"/>
    </path>
    <path d="M350,10 L580,150" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1.1s" begin="0.15s" fill="freeze"/>
    </path>
    <path d="M350,10 L60,60" stroke-dasharray="300" stroke-dashoffset="300" stroke="#1E90FF">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="1.1s" begin="0.3s" fill="freeze"/>
    </path>
    <path d="M350,10 L640,60" stroke-dasharray="300" stroke-dashoffset="300" stroke="#1E90FF">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="1.1s" begin="0.45s" fill="freeze"/>
    </path>
    <path d="M350,10 L350,160" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" from="160" to="0" dur="0.9s" begin="0.6s" fill="freeze"/>
    </path>
  </g>

  <!-- concentric web rings -->
  <g stroke="#E23636" fill="none" opacity="0.7">
    <circle cx="350" cy="10" r="40" stroke-dasharray="251" stroke-dashoffset="251">
      <animate attributeName="stroke-dashoffset" from="251" to="0" dur="1s" begin="0.7s" fill="freeze"/>
    </circle>
    <circle cx="350" cy="10" r="80" stroke-dasharray="502" stroke-dashoffset="502" stroke="#1E90FF">
      <animate attributeName="stroke-dashoffset" from="502" to="0" dur="1.2s" begin="0.85s" fill="freeze"/>
    </circle>
  </g>

  <!-- spider dropping in -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.2s" fill="freeze"/>
    <line x1="350" y1="10" x2="350" y2="90" stroke="#E23636" stroke-width="1"/>
    <g id="dropSpider">
      <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="#0D0D0D" stroke="#E23636" stroke-width="1.2"/>
      <circle cx="5.5" cy="-1.5" r="2.8" fill="#0D0D0D" stroke="#E23636" stroke-width="1"/>
      <path d="M-5,-3 L-13,-8 M-5,0 L-14,0 M-5,3 L-13,8 M3,-4 L9,-11 M3,4 L9,11 M5,-3 L12,-7 M5,3 L12,7" stroke="#1E90FF" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <animateMotion path="M350,10 L350,90" begin="1.6s" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-4; 0,0" begin="2.5s" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
