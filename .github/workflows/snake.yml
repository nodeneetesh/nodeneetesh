name: Spider Snake Generation

on:
  schedule:
    # Runs once a day at 00:00 UTC — edit the cron if you want a different time
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/spider-snake.svg
            dist/spider-snake-dark.svg?palette=github-dark
          # Spider palette: black background, red/blue snake body
          # (Platane/snk supports custom color options — see README of that action
          # if you want to hand-pick exact hex values instead of a built-in palette)

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
